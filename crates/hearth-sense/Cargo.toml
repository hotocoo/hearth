[package]
name = "hearth-sense"
description = "Measured host, process and accelerator memory sensing for the hearth inference control plane"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[lints.rust]
# Platform FFI lives in `sys/`; every unsafe block there carries a SAFETY comment.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[target.'cfg(target_os = "macos")'.dependencies]
libproc = "0.14.11"
objc2-metal = { version = "0.3.2", default-features = false, features = ["std", "MTLDevice"] }
