# hearth configuration.
#
# hearth measures what it can and learns what it observes. This file holds
# only what can be neither measured nor learned yet. The hearth binaries embed
# this file as their base layer. To override a value, put the same key in
# your own file: $HEARTH_CONFIG, or $XDG_CONFIG_HOME/hearth/hearth.toml
# (default ~/.config/hearth/hearth.toml).

[discovery]
# How long to wait for an HTTP answer from a listening port that hearth has
# never probed before. A server that accepts the connection and never answers
# (a wedged scheduler, for example) is reported as unresponsive after this.
# Once a runtime has answered often enough, a deadline learned from its
# recorded answers replaces this value (see learned_deadline_multiplier).
first_contact_timeout_ms = 2500

# Most bytes read from one probe response. Probes ask runtimes for small JSON
# documents; anything larger is not a runtime answering a probe.
max_probe_response_bytes = 8388608

# Once a runtime has answered on a port several times, its probe deadline is
# learned from those answers instead of first_contact_timeout_ms: the slowest
# answer recorded for that program on that port, times this multiplier,
# never more than first_contact_timeout_ms. A runtime that misses its learned
# deadline is asked again with the first-contact deadline before it is called
# unresponsive, and is reported as slow if it then answers.
learned_deadline_multiplier = 10.0

# Recorded answers needed before the learned deadline replaces the
# first-contact one.
learned_min_samples = 3

# How many of the latest ports snapshots deadlines are learned from. Every
# ports run reads them, hearthd's watch rounds included, so this bounds
# that work however long the history grows.
learned_from_snapshots = 100

# Shortest learned deadline. Runtimes on loopback often answer in well under
# a millisecond, and ten times that is less than the scheduling jitter of a
# busy machine probing many ports at once; below this floor a healthy runtime
# would be reported slow.
learned_deadline_floor_ms = 50

[state]
# Snapshots kept per kind (ports, doctor, run, note) in the state directory:
# $HEARTH_STATE, or $XDG_STATE_HOME/hearth (default ~/.local/state/hearth).
# A hard cap: past it the oldest are deleted, whatever the tiers say.
# `hearth log` lists them, `hearth diff` compares two. Tagged snapshots are
# kept and not counted. A doctor snapshot is some tens of KB.
max_snapshots_per_kind = 1000

# Longest note `hearth note` records, in bytes: a note is a sentence or
# two about what was done, not a log.
max_note_bytes = 4096

# Most tags at once. Tagged snapshots are kept past retention, so without a
# bound an agent naming moments in a loop would grow the history forever.
# Moving an existing name is always allowed.
max_tags = 100

# Kinds that are states of the machine (ports, doctor), thinned with age by
# the tiers below. Events (run, note) are only capped: every one matters.
thinned_kinds = ["ports", "doctor"]

# How thinned kinds age: within each window from now, one snapshot is kept
# per interval (every one when every_ms is 0); past the last window they are
# deleted. Defaults: every snapshot for an hour, one per 10 minutes for a
# day, one per hour for a week, so `hearth diff --from @1d` has a
# yesterday to compare with.
[[state.tiers]]
within_ms = 3600000
every_ms = 0

[[state.tiers]]
within_ms = 86400000
every_ms = 600000

[[state.tiers]]
within_ms = 604800000
every_ms = 3600000

[accelerators]
# How long a GPU driver tool (nvidia-smi) may take to answer before it is
# killed and the query reported as failed. A wedged driver can leave it
# stuck in the kernel; doctor, fit and the metrics must not wait with it.
query_timeout_ms = 5000

[pressure]
# Linux publishes no memory pressure level, only how much of the last ten
# seconds tasks stalled waiting for memory (PSI, /proc/pressure/memory). These
# turn it into one, for doctor, watch and metrics; macOS's own level is used
# as is. Warn when some task stalled at least this percent of the time.
psi_some_warn = 10.0

# Critical when all tasks stalled together at least this percent of the time.
# For comparison, systemd-oomd's default is to start killing at 60.
psi_full_critical = 20.0

[supervise]
# `hearth run` keeps one model server alive. These bound how hard it tries.
# Defaults follow Aletheia's supervisor, which they were ported from.

# Exits tolerated before hearth gives up, counted since the server last
# stayed ready a whole restart_window_ms: more is a crash loop, and
# restarting a model that cannot load only burns the machine. A run that
# never stays ready that long counts, however long it took to fail.
restart_budget = 5
restart_window_ms = 60000

# Wait before a restart: starts here, grows by backoff_factor per exit up
# to the maximum, and resets once a server has stayed ready a whole window.
# The maximum may not exceed restart_window_ms, or exits would never share a
# window and a crash loop would go unnoticed.
backoff_start_ms = 500
backoff_max_ms = 8000
backoff_factor = 2

# How long a started server has to answer as a runtime serving the expected
# model. Large models on a cold disk take minutes to load.
ready_timeout_ms = 180000

# SIGTERM, then SIGKILL after this. A llama.cpp server whose Metal backend
# latched after an out-of-memory error does not exit on SIGTERM.
stop_grace_ms = 5000

# How often the server is probed, and how many probes in a row may find it
# not serving (no answer, refused, or not the expected model) before it is
# called wedged and restarted.
probe_interval_ms = 1000
unresponsive_probes = 3

# Lines of each server's own output hearthd keeps, for `hearth logs NAME`
# and the MCP tool `logs`: enough to see why it failed, not a log archive.
output_lines = 200

# Longest line of server output kept; the rest is cut. Servers that print
# progress bars without newlines would otherwise make one line of anything.
output_line_bytes = 1024

# hearthd starts one server at a time: a server about to start waits
# while another it keeps is still loading (not yet ready), so two models
# never fill memory at the same moment, the commonest way several local
# models take a machine down. Measured admission (ADR-000) is the way past
# this once its gate has run.
serialize_loads = true

# hearthd holds a server's start while available memory is below what that
# server held when it last became ready, plus admit_headroom_bytes. That
# footprint is a lower bound (it may leave out memory-mapped weights, see
# ADR-000), so a held start is one that certainly would not fit. A server
# never measured starts; memory that cannot be read holds the start.
admit_by_footprint = true

# Kept free above that footprint. One GiB covers most of the short-term
# swing in available memory on a busy machine (ADR-000 measured a 3-sigma
# of 2.45 GiB over 90 s); the start goes ahead at the first poll it fits.
admit_headroom_bytes = 1073741824

[notify]
# Who hears about a server hearth gave up on, one it found wedged, or one
# whose backend poisoned itself. Both channels are off by default.

# A desktop notification: osascript on macOS, notify-send on Linux.
desktop = false

# POST the event as JSON to this URL with curl (http:// or https://), e.g.
# an ntfy topic or a chat webhook. Unset means no webhook.
# webhook_url = "https://ntfy.sh/your-topic"

# How long one webhook delivery may take.
timeout_ms = 5000

[watch]
# `hearth watch` observes on these intervals. Every observation is recorded,
# and state.tiers decides how much of it is kept as it ages.
doctor_interval_ms = 10000
ports_interval_ms = 60000

# A resource growing at the measured rate is reported when it would reach
# its limit (the kernel's, or the process's) within this long. Growth alone
# is not reported: descriptor and thread counts move all the time.
limit_horizon_ms = 3600000

# Rounds in a row a projected limit, or a ports warning (a server slow or
# configured past the device), must show before it is reported, and must be
# gone before it is reported cleared. One rate measured over one
# interval wobbles; without this a count hovering near the horizon would
# open and clear on alternate rounds. Kernel memory pressure is reported at
# once.
confirm_rounds = 2

# Whether hearthd runs these rounds too, alongside keeping its servers. When
# it does, `hearth watch` refuses to run beside it, so nothing is reported
# twice.
in_hearthd = true

[control]
# hearthd's control socket (hearth status, hearth restart, MCP). Requests and
# answers are a few hundred bytes of JSON; anything past this many bytes is
# refused, so a client cannot make hearthd hold arbitrary amounts of memory.
max_message_bytes = 65536

# How long one exchange on the socket may take, from connecting to the last
# byte of the answer. A client that stalls holds its handler this long.
timeout_ms = 2000

# Clients answered at once. Answers come from memory and take microseconds,
# so this only matters when clients stall; one beyond it is told hearthd is
# busy rather than queued.
max_clients = 8

[bundle]
# How many of the latest run events and notes `hearth bundle` includes.
recent_events = 50

[mcp]
# How many entries the history tools (log, follow, diff) return to an agent
# that asks for no limit: a whole history runs to hundreds of KB, past an
# agent's context.
history_limit = 50

# Longest message `hearth mcp` reads from its client. A longer line is
# answered with a parse error and skipped, so one bad message cannot stop
# the server or fill its memory.
max_message_bytes = 1048576

[metrics]
# Where hearthd serves Prometheus metrics (GET /metrics): each server's state
# and restarts, the machine's memory, pressure, open files and threads.
# Unset means off. Keep it on loopback unless the scraper is elsewhere: the
# metrics name the servers this machine runs.
# listen = "127.0.0.1:9469"

[gateway]
# Where hearthd forwards requests to the servers it keeps: a request for
# /s/NAME/REST goes to server NAME as /REST, so a client's base URL is
# http://LISTEN/s/NAME/v1. A server that is not ready, or not configured,
# gets a JSON error saying what to do instead of a hang. Unset means off.
# Keep it on loopback: it forwards to the servers with no authentication.
# listen = "127.0.0.1:9470"

# Most bytes of one request's line and headers. Bodies are not limited:
# they stream through to the server as they arrive.
max_head_bytes = 65536

# How long a client may take to send its request line and headers.
head_timeout_ms = 10000

# How long a client may take, in all, to send a body the gateway reads
# whole (one kept for retry, or an Ollama request to translate). Large
# base64 images over a slow link need more than the head's time.
body_timeout_ms = 120000

# How long connecting to the server may take before the client is told it
# could not be reached.
connect_timeout_ms = 2000

# How long a request may go without a byte from the server before both
# sides are closed. Long enough for a large prompt's prefill, which sends
# nothing until the first token.
idle_timeout_ms = 600000

# How long a request for a server that is starting, or waiting out a
# restart hearthd decided, is held before it is refused. A client that
# arrives during a restart is then served when the server is ready, not
# turned away. A stopped or given-up server is refused at once.
ready_wait_ms = 120000

# How often a held request checks whether its server is ready, and a
# request waiting for its server's first byte whether its client is still
# there: a client that leaves cancels it then.
ready_poll_ms = 200

# How many times a request is sent again when its server fails before
# answering: the connection refused or closed, or a 5xx after which hearthd
# restarts it (a poisoned backend). Only while nothing has reached the
# client, and within ready_wait_ms in all. 0 turns retrying off.
retries = 2

# Largest request body kept so it can be sent again. Larger bodies, and
# chunked ones, stream through once and are never retried. At most
# max_clients bodies are held at once, so the worst case is this times
# max_clients (128 MiB at the defaults); raise it for large base64 images.
retry_body_bytes = 2097152

# After a 5xx, how long to watch for hearthd restarting the server before
# passing the 5xx on as the application's own answer.
retry_grace_ms = 3000

# Requests one server runs at once through the gateway; set it to the
# server's slots (llama-server -np). When it is full, requests wait their
# turn, round robin across apps (the X-Hearth-App header names one), so
# one app's batch cannot hold up another app's request. Waiting counts
# toward ready_wait_ms. 0 turns queuing off: everything goes straight on.
per_server_concurrency = 0

# Largest Ollama-API request (/api/chat, /api/generate) translated for a
# server that only speaks OpenAI's API. The body is read whole to translate
# it, so this bounds what one request holds; images in base64 count. Parsed
# and re-encoded, a body takes a few times its size, and max_clients
# requests can translate at once: lower this on a machine short of memory.
translate_body_bytes = 33554432

# Requests forwarded at once; one beyond this is told the gateway is busy.
max_clients = 64

# Web pages allowed to call the gateway from a browser, by origin
# ("http://localhost:3000", an app's "app://name", or "null"). A request carrying any other Origin is refused,
# and so is a Host that is not an IP address or localhost, so a website
# cannot spend this machine's models (cross-site requests, DNS rebinding).
# Programs that are not browsers send no Origin and are not affected.
allowed_origins = []

[dashboard]
# Where hearthd serves its dashboard: a web page with the servers it keeps,
# the machine's memory and findings, and the journal, with buttons to
# restart, stop and start servers and read their output. Unset means off.
# Loopback only: the page acts on servers and has no login, so any other
# address is refused. Open http://LISTEN/ in a browser on this machine.
# listen = "127.0.0.1:9471"

# How often an open dashboard asks for a fresh view. A hidden tab asks
# less often.
refresh_ms = 2000

# Journal entries the dashboard shows, newest first.
journal = 30

# Most bytes of one request's line and headers. The page sends small
# requests with no body; anything longer is cut off and refused.
max_head_bytes = 16384

# How long one request to the dashboard may take, from connecting to the
# last byte of the answer.
timeout_ms = 5000

# Requests answered at once; one beyond this is closed.
max_clients = 16

# Servers hearthd starts and keeps alive, one table each, named
# [servers.NAME] in your own file: port (where it listens), command (the
# program and its arguments, as a list), and optionally host (the address to
# probe, loopback when unset) and expect (part of the model name the server
# must report before it counts as ready). None are built in. hearthd
# supervises each exactly as `hearth run` would, with the [supervise] values.
# A program without a path is looked up in hearthd's PATH, which under a
# login service is the PATH `hearth service install` was run with; an
# absolute path avoids the question.
# Optional per server: env, a table of variables set for it on top of
# hearthd's own (GGML_METAL_*, CUDA_VISIBLE_DEVICES, HF_HOME), and dir, the
# absolute working directory it starts in. And optionally model, ctx and
# cache_type together (the model as `hearth fit` takes it: a path, org/repo
# or an Ollama name): hearthd then checks before every start that the model
# at that context fits the device at all, and refuses to start one that
# never can, instead of letting it run out of accelerator memory.
[servers]
