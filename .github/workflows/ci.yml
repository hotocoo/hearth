name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Linux memory pressure is derived from PSI
        if: runner.os == 'Linux'
        run: |
          cargo build -p hearth --bin hearth
          ./target/debug/hearth --json doctor | python3 -c "import json,sys; p=json.load(sys.stdin)['health']['memory']['pressure']; print('pressure', p); assert p in ('normal','warn','critical')"
      - name: docs/configuration.md matches the shipped configuration
        if: runner.os == 'Linux'
        run: |
          cargo build -p hearth --bin hearth
          ./target/debug/hearth config --markdown | diff -u docs/configuration.md -
      - name: no source file over 800 lines
        if: runner.os == 'Linux'
        run: |
          long=$(find crates -name '*.rs' -exec wc -l {} + | awk '$2 != "total" && $1 > 800 { print $2 " (" $1 " lines)" }')
          if [ -n "$long" ]; then echo "$long"; exit 1; fi
      - name: completion scripts parse
        if: runner.os == 'Linux'
        run: |
          cargo build -p hearth --bin hearth
          ./target/debug/hearth completions bash | bash -n
      - name: incidents smoke test (Linux kernel log)
        if: runner.os == 'Linux'
        run: |
          cargo build -p hearth --bin hearth
          # The runner may not be allowed to read the kernel log; then the
          # command must say why, not crash or claim there is nothing.
          # Every boot, not only the current one (-k would imply -b).
          echo "kernel lines, all boots: $(journalctl _TRANSPORT=kernel -q --no-pager 2>/dev/null | wc -l); current boot: $(journalctl -k -q --no-pager 2>/dev/null | wc -l)"
          if ./target/debug/hearth --json incidents > incidents.json 2> incidents.err; then
            python3 -c "import json; json.load(open('incidents.json'))"
          else
            grep -q "journalctl" incidents.json incidents.err
          fi
      - name: journal smoke test (record, note, grep, tag, diff)
        env:
          HEARTH_STATE: ${{ runner.temp }}/hearth-state
        run: |
          cargo build -p hearth --bin hearth
          h=./target/debug/hearth
          $h ports > /dev/null
          $h note --by ci smoke run
          $h ports > /dev/null
          $h log --all
          test "$($h --json log --all | python3 -c "import json,sys; print(sorted({s['kind'] for s in json.load(sys.stdin)['snapshots']}))")" = "['note', 'ports']"
          test "$($h --json log --kind note --grep SMOKE | python3 -c "import json,sys; print(len(json.load(sys.stdin)['snapshots']))")" = 1
          $h tag ci-start --at '~1'
          $h diff --from ci-start
      - name: models smoke test (an MLX repo in a fake Hugging Face cache)
        env:
          HF_HUB_CACHE: ${{ runner.temp }}/hf
        run: |
          cargo build -p hearth --bin hearth
          # An empty home: no LM Studio or Ollama models of the runner's.
          # Only hearth runs with it; cargo needs the real one.
          home="${{ runner.temp }}/home"
          h() { HOME="$home" OLLAMA_MODELS="$home/ollama" ./target/debug/hearth "$@"; }
          snap="$HF_HUB_CACHE/models--org--tiny-mlx/snapshots/abc123"
          mkdir -p "$snap" "$home"
          printf '{"model_type":"llama","num_hidden_layers":2,"num_attention_heads":4,"num_key_value_heads":2,"head_dim":8,"max_position_embeddings":4096,"torch_dtype":"bfloat16"}' > "$snap/config.json"
          head -c 1024 /dev/zero > "$snap/model.safetensors"
          h models
          h --json models | python3 -c "import json,sys; m=json.load(sys.stdin)['models']; assert [x['name'] for x in m] == ['org/tiny-mlx'], m; assert m[0]['arch'] == 'llama' and m[0]['weights_bytes'] == 1024 and m[0]['cache_type'] == 'bf16', m"
          h fit org/tiny-mlx --ctx 4096
      - name: probe smoke test
        run: |
          cargo build --release -p hearth-sense --bin hearth-probe
          duration_s=2 interval_ms=200
          ./target/release/hearth-probe sample --duration-s $duration_s --interval-ms $interval_ms --pid $$ --out probe.jsonl
          # At least every tick but the last must have produced a sample.
          expected=$(( duration_s * 1000 / interval_ms - 1 ))
          test "$(grep -c '"kind":"sample"' probe.jsonl)" -ge "$expected"

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Lints the next Rust release adds, six weeks before stable makes them
  # fail the build: a warning here, not a failure.
  clippy-beta:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@beta
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
